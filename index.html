<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Laboratório Secreto da Ciência</title><style>

.code{color:#c28a1e}
.door i{background:linear-gradient(#cdd8ee,#b3c1e0);border-color:#8fa4d6}

</style></head><body>
<div id="st"><div style="max-width:640px"><h1>🔬 O Laboratório Secreto da Ciência</h1><p>Um erro no sistema central trancou todas as portas e embaralhou as pesquisas! Sou o NEXO, a inteligência do laboratório. Recupere cinco códigos científicos, um em cada sala, e escape!</p><button class="b" style="font-size:22px" onclick="go()">▶ Iniciar missão</button> <button class="b" id="sb" onclick="snd()">🔊 Som: ligado</button></div></div>
<div id="hud"><span id="dots"></span><span id="tm">⏱ 00:00</span><button class="b" onclick="inv()">🎒 Pistas</button><button class="b" onclick="hint()">💡 Dica</button><button class="b" onclick="pz()">⏸ Pausar</button><button class="b" id="fb" onclick="fin()">🚪 Porta final</button><span id="cds"></span></div>
<div id="stage"><div id="rm"></div></div><div id="pn"></div><div id="ov"></div>
<script>
const $=q=>document.querySelector(q),AC=window.AudioContext||window.webkitAudioContext;let ac;
const S={r:0,st:[0,0,0,0,0],pl:{},codes:[],inv:[],t:0,p:0,snd:1,rc:0,fin:[0,0,0,0,0],seen:[],ry:0,z:1,sel:null,n:0,od:{},f:[]};let lk=0;
function bp(f,d=.15){if(!S.snd||!AC)return;try{ac=ac||new AC();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

const E={e:['Tecido epitelial','Epitelial cobre e protege: forma a pele e o revestimento do intestino (e outros órgãos).','Esse tecido forma camadas que cobrem e revestem o corpo por fora e por dentro.'],

const R=[
{n:'Ecossistema descontrolado',code:'E-417',h:130,sc:['🌲','🌊','🦊','🪨','☀️','🌿'],s:[
{t:'Maquete viva',q:'Arraste cada elemento para Biótico (com vida) ou Abiótico (sem vida).',c:'Ecossistema = seres vivos + elementos sem vida que interagem.',Z:[['b','🌱 Biótico','Bióticos são seres vivos: nascem, crescem e se reproduzem.','Pergunte: isso nasce, cresce, se alimenta e se reproduz?'],['a','🪨 Abiótico','Abióticos não têm vida, mas são essenciais: luz, água, ar e solo.','Esse elemento nunca nasce nem se reproduz: não tem vida.']],I:[['🐸','Sapo','b'],['🌿','Samambaia','b'],['🐝','Abelha','b'],['🍄','Cogumelo','b'],['💨','Vento','a'],['🏖️','Areia','a'],['💧','Água do rio','a'],['☀️','Luz do Sol','a']]},
{t:'Relações ecológicas',q:'Associe cada cena à relação ecológica.',c:'Relações: mutualismo, predação, competição e parasitismo.',Z:[['m','🤝 Mutualismo','Mutualismo: os dois seres saem ganhando.','Nessa cena, os dois seres saem ganhando.'],['p','🦅 Predação','Predação: um animal caça e come outro.','Aqui um ser caça outro para se alimentar.'],['c','⚔️ Competição','Competição: disputa pelo mesmo recurso (luz, água, comida).','Os seres disputam o mesmo recurso.'],['s','🦟 Parasitismo','Parasitismo: um vive às custas do outro e o prejudica.','Um vive sobre o outro, se alimenta dele e o prejudica.']],I:[['🐝🌸','Abelha leva pólen e toma néctar','m'],['🦉🐭','Coruja caça um rato','p'],['🌱🌱','Duas plantas disputam luz','c'],['🐕🪲','Carrapato suga sangue do cão','s'],['🐦🦏','Pássaro come insetos do rinoceronte','m']]}]},
{n:'Reator de energia',code:'R-238',h:25,sc:['⚛️','☀️','🌿','🐛','🍄','🔋'],s:[

{t:'Quem come o quê?',q:'Classifique pela alimentação.',c:'Herbívoro, carnívoro, onívoro e detritívoro.',Z:[['h','🌾 Herbívoro','Herbívoros comem plantas.','Esse animal come só vegetais.'],['c','🥩 Carnívoro','Carnívoros comem outros animais.','Esse animal caça e come outros animais.'],['o','🍽️ Onívoro','Onívoros comem plantas e animais.','Esse animal come vegetais e também animais.'],['d','🍂 Detritívoro','Detritívoros comem restos de seres vivos.','Esse animal se alimenta de restos e matéria em decomposição.']],I:[['🐇','Coelho','h'],['🐄','Vaca','h'],['🦁','Leão','c'],['🐆','Onça','c'],['🐻','Urso','o'],['🐷','Porco','o'],['🪱','Minhoca','d'],['🪲','Besouro rola-bosta','d']]},
{t:'Decompositores',q:'Quem decompõe restos e devolve nutrientes?',c:'Fungos e bactérias decompõem restos e reciclam nutrientes.',Z:[['d','♻️ Decompositor','Fungos e bactérias transformam restos em nutrientes para o solo.','Esse ser transforma restos de plantas e animais em nutrientes.'],['n','❌ Não decompõe','Plantas produzem alimento e coelhos o consomem: não decompõem.','Esse ser não decompõe restos: ele produz ou consome alimento.']],I:[['🍄','Fungo','d'],['🦠','Bactéria','d'],['🌻','Girassol','n'],['🐇','Coelho','n']]},
{t:'Energia ou matéria?',q:'Separe o que flui (energia) do que recicla (matéria).',c:'Energia flui em um sentido; a matéria é reciclada.',Z:[['e','☀️ Fluxo de energia','A energia vem do Sol, passa pelos seres e se perde como calor: não volta.','Isso passa de um nível para o outro e não retorna.'],['m','♻️ Ciclo da matéria','A matéria volta ao ambiente pela decomposição e é usada de novo.','Isso retorna ao solo e é usado de novo pelas plantas.']],I:[['☀️','Luz do Sol entra na cadeia','e'],['🔥','Energia vira calor e se perde','e'],['🍂','Restos viram nutrientes no solo','m'],['🌱','Plantas usam os nutrientes de novo','m']]}]},
{n:'Laboratório microscópico',code:'C-905',h:270,sc:['🔬','🧫','🧪','💻','🔭','🧬'],s:[

{t:'Pequeno, médio ou grande?',q:'Arraste cada item para o grupo certo.',c:'Células juntas formam tecidos. O ser vivo inteiro é o organismo.',Z:[['c','🔬 Célula (uma só)','Célula: a menor parte viva. Só aparece no microscópio.','É bem pequenininha: uma única célula, só vista no microscópio.'],['t','🧱 Tecido (várias iguais)','Tecido: muitas células iguais juntas, fazendo o mesmo trabalho.','São muitas células iguais juntas, como num tijolo de células.'],['o','🐶 Organismo (ser inteiro)','Organismo: o ser vivo completo, que você enxerga.','É o ser vivo inteiro, que dá para ver sem microscópio.']],I:[['🍃','Uma célula da folha','c'],['💪','Várias células do músculo juntas','t'],['🐶','Um cachorro inteiro','o'],['🌳','Uma árvore inteira','o']]},
{t:'Célula-tronco',q:'Esta célula-tronco fica no osso e fabrica células do sangue. Quais ela fabrica?',deco:'<div class="cell"><i></i><b></b></div>',c:'A célula-tronco vira outras células (diferenciação), mas cada tipo faz só alguns tipos.',Z:[['y','🩸 Ela fabrica','Isso mesmo! Ela vira (se diferencia em) células do sangue.','Ela é do osso e fabrica células do sangue.'],['n','❌ Ela não fabrica','Esta célula-tronco não fabrica essas células. Cada tipo faz só alguns tipos.','Estas células não são do sangue, então ela não fabrica.']],I:[['🩸','Glóbulo vermelho','y'],['🛡️','Glóbulo branco','y'],['🧠','Célula do cérebro','n'],['🧴','Célula da pele','n']]}]},
{n:'Corpo humano misterioso',code:'T-662',h:340,sc:['🧍','🫀','🧠','🦴','🩺','💊'],s:[

B:[['n','🧠 Cérebro',70,0,60,60],['n','Medula e nervos',86,100,28,100],['m','❤️ Coração',58,76,36,36],['e m','Intestino',58,140,84,56],['c','🦴 Costelas',104,76,40,50],['e','Pele do braço',159,62,36,140],['m','Músculo do braço',5,62,36,140],['m','Músculo da perna',50,215,48,160],['c','🦴 Osso e cartilagem do joelho',102,215,48,160]]}]},

function hud(){const m=String(S.t/60|0).padStart(2,'0'),s=String(S.t%60).padStart(2,'0');$('#tm').textContent='⏱ '+m+':'+s;$('#dots').innerHTML=R.map((x,i)=>`<button class="b dt ${S.st[i]>=x.s.length?'ok':''} ${i==S.r?'cur':''}" ${i>S.rc?'disabled':''} onclick="room(${i})">${S.st[i]>=x.s.length?'✓':i+1}</button>`).join(' ');$('#cds').textContent='🔑 '+S.codes.length+'/5: '+S.codes.map(c=>c).join(' ');$('#fb').disabled=false}
